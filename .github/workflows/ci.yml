name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: "postgresql://denk:denk@127.0.0.1:5432/denk?schema=public"
      BETTER_AUTH_SECRET: "ci-only-secret-with-at-least-32-characters"
      BETTER_AUTH_URL: "http://localhost:3000"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: denk
          POSTGRES_USER: denk
          POSTGRES_PASSWORD: denk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U denk -d denk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Validate Prisma configuration and schema
        run: pnpm db:validate

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply migrations to fresh PostgreSQL
        run: pnpm db:migrate:deploy

      - name: Verify migration state
        run: pnpm db:migrate:status

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Remove unrelated Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
